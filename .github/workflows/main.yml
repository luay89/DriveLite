name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub Ubuntu runner already ships the Android SDK (ANDROID_HOME is set).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build APKs (debug + release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify APKs (badging, signature, checksum)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk     out/DriveLite-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/DriveLite-release.apk
          for f in out/*.apk; do
            echo "================ $f"
            unzip -tq "$f"
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|sdkVersion|targetSdkVersion|launchable-activity" || true
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
            ls -lh "$f"
          done
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DriveLite-apk
          path: out/

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
