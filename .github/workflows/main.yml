name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub Ubuntu runner already ships the Android SDK (ANDROID_HOME is set).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Fail on API-level problems (NewApi) and surface lint errors
        run: |
          R=app/build/reports/lint-results-debug.xml
          [ -f "$R" ] || { echo "no lint xml"; exit 0; }
          python3 - "$R" <<'PY'
          import sys, xml.etree.ElementTree as ET
          bad = 0
          for i in ET.parse(sys.argv[1]).getroot().iter('issue'):
              sev, iid = i.get('severity'), i.get('id')
              loc = i.find('location')
              where = f"{loc.get('file','?').split('/app/')[-1]}:{loc.get('line','?')}" if loc is not None else '?'
              if sev in ('Error', 'Fatal') or iid in ('NewApi', 'InlinedApi'):
                  print(f"::warning::lint {iid} ({sev}) {where}: {i.get('message')}")
                  if iid == 'NewApi' or sev == 'Fatal':
                      bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Build APKs (debug + release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify APKs (badging, signature, checksum)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk     out/DriveLite-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/DriveLite-release.apk
          for f in out/*.apk; do
            echo "================ $f"
            unzip -tq "$f"
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|sdkVersion|targetSdkVersion|launchable-activity" || true
            MIN=$("$BT/aapt2" dump badging "$f" | grep -oE "(min)?[sS]dkVersion:'[0-9]+'" | head -1)
            SIG=$("$BT/apksigner" verify --verbose "$f" | grep -E "Verified using v[0-9]" | sed 's/Verified using //' | tr '\n' ' ')
            echo "::notice::$(basename $f) $MIN size=$(stat -c%s "$f") | $SIG"
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
            ls -lh "$f"
          done
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Publish GitHub Release (direct .apk download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v${VER}-build${{ github.run_number }}"
          cp out/DriveLite-release.apk out/DriveLite.apk
          gh release create "$TAG" out/DriveLite.apk out/DriveLite-debug.apk out/SHA256SUMS.txt \
            --title "DriveLite $VER (build ${{ github.run_number }})" \
            --notes "Install **DriveLite.apk** on the car screen. Direct link: https://github.com/${{ github.repository }}/releases/latest/download/DriveLite.apk" \
            --target "${{ github.sha }}" --latest
          echo "::notice::Release $TAG -> https://github.com/${{ github.repository }}/releases/latest/download/DriveLite.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DriveLite-apk
          path: out/

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
